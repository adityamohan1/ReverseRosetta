[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reverserosetta"
version = "0.1.0"
description = "Human codon optimization with restriction, splice, and repeat-aware refinement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ReverseRosetta contributors" }]
dependencies = [
    "pandas>=2.0,<3",
    "openpyxl>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer[all]>=0.12",
    "numpy>=1.26,<2",
    "CodonTransformer>=1.6.7",
    "torch>=2.0",
    "transformers>=4.40",
]

[project.optional-dependencies]
splicefinder = [
    "tensorflow>=2.14,<3",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
reverserosetta = "reverserosetta.cli:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["reverserosetta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
